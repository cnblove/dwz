# CNB 流水线：测试 → 构建 → 部署
#
# 部署需要 Cloudflare 凭据（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID）。
# 凭据放在密钥仓库里，通过 imports 注入，不要写进本文件。
# 把下面的密钥仓库地址换成你自己的即可（详见 docs/DEPLOY.md）。
#
# 流水线只操作「已存在」的 Cloudflare 资源：Worker 与 D1 / KV 都需先
# 在账号里建好，再把 id 填进 packages/worker/wrangler.toml。
#
# 后台静态资源随 Worker 一起发布（wrangler.toml 的 [assets] 绑定），
# 因此没有单独的 Pages 部署阶段，也不需要 Pages 项目。

# 校验四件套：install → test → typecheck → build-web。
# 逐个定义为锚点，供 main 分支的 push 与所有分支的 PR 复用 ——
# 注意别把「只该在 push 时跑」的任务（同步 GitHub、部署）混进这几个锚点：
# PR 事件会连带执行，且 PR 下的 CNB_TOKEN 权限受限。
._install: &install
  name: install
  image: node:22
  script: npm ci
._test: &test
  name: test
  image: node:22
  script: npm test
._typecheck: &typecheck
  name: typecheck
  image: node:22
  script: npm run typecheck
._build-web: &build-web
  name: build-web
  image: node:22
  script: npm run build:web

main:
  push:
    - stages:
        - *install
        - *test
        - *typecheck
        - *build-web
        # 同步到 GitHub：GitHub 上的仓库是 README 顶部一键部署按钮的依赖，
        # 也让两边的提交历史保持一致（见 docs/DEPLOY.md「同步到 GitHub」）。
        # 凭据（GIT_USERNAME / GIT_ACCESS_TOKEN）同样走密钥仓库，不在本文件里写。
        # 只在 main push 时触发：默认推送所有分支，push_tags 再把标签一起镜像，
        # 所以标签无需单独同步。放在校验之后，避免把没通过测试的 main 推上去。
        - name: sync-to-github
          image: tencentcom/git-sync
          imports:
            # 密钥仓库中的 envs.yml，除 Cloudflare 凭据外还包含
            # GIT_USERNAME 与 GIT_ACCESS_TOKEN（详见 docs/DEPLOY.md）
            - https://cnb.cool/cnblove/secret/-/blob/main/envs.yml
          settings:
            target_url: https://github.com/cnblove/dwz.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            # 标签也镜像过去：GitHub 上的一键部署按钮指向仓库，标签用于发布记录
            push_tags: true

# PR 只跑校验，不同步、不部署
"**":
  pull_request:
    - stages:
        - *install
        - *test
        - *typecheck
        - *build-web

# 密钥仓库地址：换成你自己的（详见 docs/DEPLOY.md）
$:
  # 兜底：任意 Tag 推送都触发部署
  # 注意写具体分支名只会匹配「同名 Tag」，这里用 $ 才是「所有 Tag」。
  tag_push:
    - imports:
        # 密钥仓库中的 envs.yml，需包含 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID
        - &cf-secrets https://cnb.cool/cnblove/secret/-/blob/main/envs.yml
      stages: &deploy-stages
        - name: install
          image: node:22
          script: npm ci
        - name: test
          image: node:22
          script: npm test
        - name: check-deploy-config
          image: node:22
          script: |
            # 部署前自检：wrangler.toml 里若仍是 REPLACE_WITH_* 占位符，
            # 迁移/部署必然在 Cloudflare API 处报 Invalid uuid，报错难懂。
            # 这里提前失败并给出可操作提示（见 docs/DEPLOY.md）。
            if grep -q 'REPLACE_WITH_' packages/worker/wrangler.toml; then
              echo "✘ packages/worker/wrangler.toml 仍含 REPLACE_WITH_* 占位符，无法部署。"
              echo "  请把 D1 的 database_id、KV 的 id/preview_id 换成真实值（见 docs/DEPLOY.md）。"
              grep -n 'REPLACE_WITH_' packages/worker/wrangler.toml
              exit 1
            fi
            echo "✔ 部署配置已就绪"
        # wrangler 的每个子命令都要打 Cloudflare API。CI 出口偶发丢包时
        # wrangler 只会抛一句 `fetch failed`，看起来像配置错，实则重跑即过
        # （见 Issue #23：同一流水线 5 分钟前刚成功过）。这里让 Stage 自愈，
        # 不把一次网络抖动升级成一次人工介入。重试间隔 1s/2s/4s...
        - name: migrate
          image: node:22
          retry: 2
          script: |
            npx wrangler d1 migrations apply dwz --remote --config packages/worker/wrangler.toml
            # 迁移「成功」不代表库里有表：如果 apply 解析到的 D1 与 Worker 绑定的
            # database_id 不是同一个（或迁移文件为空），Worker 上线后会对着空库报
            # 「no such table」，表现为所有接口 500。这里直接查一次核心表兜底，
            # 让问题在部署阶段暴露，而不是等到线上注册失败。
            #
            # 判定要和「网络抖动」分开：`wrangler d1 execute` 自身失败（fetch failed /
            # 鉴权失败）时输出里没有 JSON，不能把它说成「找不到 users 表」——
            # 上一轮的误导就出在这里。先让 wrangler 独立跑完并留档输出，再判表。
            query_out=$(npx wrangler d1 execute dwz --remote --config packages/worker/wrangler.toml \
              --command "SELECT name FROM sqlite_master WHERE type='table' AND name='users'" \
              --json) || {
              echo "✘ 校验 users 表时 wrangler 自身失败（多为 Cloudflare API 网络/鉴权问题，非库结构问题）："
              echo "$query_out"
              exit 1
            }
            echo "$query_out"
            echo "$query_out" | grep -q '"name": *"users"' \
              && echo "✔ users 表已存在" \
              || { echo "✘ 迁移后仍找不到 users 表：请确认 wrangler.toml 的 database_id 与迁移目标是同一个 D1"; exit 1; }
        - name: deploy
          image: node:22
          # 同 migrate：deploy 也要打 Cloudflare API，抗一次网络抖动
          retry: 2
          script: |
            # 后台产物要先于 Worker 构建完成：wrangler.toml 的 [assets].directory
            # 指向 packages/web/dist，而 dist 不进版本库（.gitignore），
            # 目录不存在时 deploy 会直接报错。
            npm run build:web
            npx wrangler deploy --config packages/worker/wrangler.toml

  # .cnb/tag_deploy.yml 的「部署」按钮触发
  tag_deploy.production:
    - imports:
        - *cf-secrets
      stages: *deploy-stages

  # .cnb/web_trigger.yml 的分支页「部署到 Cloudflare」按钮触发
  web_trigger_deploy:
    - imports:
        - *cf-secrets
      stages: *deploy-stages
