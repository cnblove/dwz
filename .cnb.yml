# CNB 流水线：测试 → 构建 → 部署
#
# 部署需要 Cloudflare 凭据（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID）。
# 凭据放在密钥仓库里，通过 imports 注入，不要写进本文件。
# 把下面的密钥仓库地址换成你自己的即可（详见 docs/DEPLOY.md）。
#
# 流水线只操作「已存在」的 Cloudflare 资源：Worker 与 D1 / KV 都需先
# 在账号里建好，再把 id 填进 packages/worker/wrangler.toml。
#
# 后台静态资源随 Worker 一起发布（wrangler.toml 的 [assets] 绑定），
# 因此没有单独的 Pages 部署阶段，也不需要 Pages 项目。

main:
  push:
    - stages: &verify-stages
        - name: install
          image: node:22
          script: npm ci
        - name: test
          image: node:22
          script: npm test
        - name: typecheck
          image: node:22
          script: npm run typecheck
        - name: build-web
          image: node:22
          script: npm run build:web

# PR 只跑校验，不部署
"**":
  pull_request:
    - stages: *verify-stages

# 密钥仓库地址：换成你自己的（详见 docs/DEPLOY.md）
$:
  # 兜底：任意 Tag 推送都触发部署
  # 注意写具体分支名只会匹配「同名 Tag」，这里用 $ 才是「所有 Tag」。
  tag_push:
    - imports:
        # 密钥仓库中的 envs.yml，需包含 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID
        - &cf-secrets https://cnb.cool/cnblove/secret/-/blob/main/envs.yml
      stages: &deploy-stages
        - name: install
          image: node:22
          script: npm ci
        - name: test
          image: node:22
          script: npm test
        - name: check-deploy-config
          image: node:22
          script: |
            # 部署前自检：wrangler.toml 里若仍是 REPLACE_WITH_* 占位符，
            # 迁移/部署必然在 Cloudflare API 处报 Invalid uuid，报错难懂。
            # 这里提前失败并给出可操作提示（见 docs/DEPLOY.md）。
            if grep -q 'REPLACE_WITH_' packages/worker/wrangler.toml; then
              echo "✘ packages/worker/wrangler.toml 仍含 REPLACE_WITH_* 占位符，无法部署。"
              echo "  请把 D1 的 database_id、KV 的 id/preview_id 换成真实值（见 docs/DEPLOY.md）。"
              grep -n 'REPLACE_WITH_' packages/worker/wrangler.toml
              exit 1
            fi
            echo "✔ 部署配置已就绪"
        - name: migrate
          image: node:22
          script: |
            npx wrangler d1 migrations apply dwz --remote --config packages/worker/wrangler.toml
            # 迁移「成功」不代表库里有表：如果 apply 解析到的 D1 与 Worker 绑定的
            # database_id 不是同一个（或迁移文件为空），Worker 上线后会对着空库报
            # 「no such table」，表现为所有接口 500。这里直接查一次核心表兜底，
            # 让问题在部署阶段暴露，而不是等到线上注册失败。
            npx wrangler d1 execute dwz --remote --config packages/worker/wrangler.toml \
              --command "SELECT name FROM sqlite_master WHERE type='table' AND name='users'" \
              --json | grep -q '"name": *"users"' \
              && echo "✔ users 表已存在" \
              || { echo "✘ 迁移后仍找不到 users 表：请确认 wrangler.toml 的 database_id 与迁移目标是同一个 D1"; exit 1; }
        - name: deploy
          image: node:22
          script: |
            # 后台产物要先于 Worker 构建完成：wrangler.toml 的 [assets].directory
            # 指向 packages/web/dist，而 dist 不进版本库（.gitignore），
            # 目录不存在时 deploy 会直接报错。
            npm run build:web
            npx wrangler deploy --config packages/worker/wrangler.toml

  # .cnb/tag_deploy.yml 的「部署」按钮触发
  tag_deploy.production:
    - imports:
        - *cf-secrets
      stages: *deploy-stages

  # .cnb/web_trigger.yml 的分支页「部署到 Cloudflare」按钮触发
  web_trigger_deploy:
    - imports:
        - *cf-secrets
      stages: *deploy-stages
