# CNB 流水线：测试 → 构建 → 部署
#
# 部署需要 Cloudflare 凭据（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID）。
# 凭据放在密钥仓库里，通过 imports 注入，不要写进本文件。
# 把下面的密钥仓库地址换成你自己的即可（详见 docs/DEPLOY.md）。
#
# 流水线只操作「已存在」的 Cloudflare 资源，唯一例外是 Pages 项目：
# 它在 deploy-pages 阶段按项目名自动创建（幂等）。Worker 与 D1 / KV
# 仍需先在账号里建好，再把 id 填进 packages/worker/wrangler.toml。

main:
  push:
    - stages: &verify-stages
        - name: install
          image: node:22
          script: npm ci
        - name: test
          image: node:22
          script: npm test
        - name: typecheck
          image: node:22
          script: npm run typecheck
        - name: build-web
          image: node:22
          script: npm run build:web

# PR 只跑校验，不部署
"**":
  pull_request:
    - stages: *verify-stages

# 密钥仓库地址：换成你自己的（详见 docs/DEPLOY.md）
$:
  # 兜底：任意 Tag 推送都触发部署
  # 注意写具体分支名只会匹配「同名 Tag」，这里用 $ 才是「所有 Tag」。
  tag_push:
    - imports:
        # 密钥仓库中的 envs.yml，需包含 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID
        - &cf-secrets https://cnb.cool/cnblove/secret/-/blob/main/envs.yml
      stages: &deploy-stages
        - name: install
          image: node:22
          script: npm ci
        - name: test
          image: node:22
          script: npm test
        - name: check-deploy-config
          image: node:22
          script: |
            # 部署前自检：wrangler.toml 里若仍是 REPLACE_WITH_* 占位符，
            # 迁移/部署必然在 Cloudflare API 处报 Invalid uuid，报错难懂。
            # 这里提前失败并给出可操作提示（见 docs/DEPLOY.md）。
            if grep -q 'REPLACE_WITH_' packages/worker/wrangler.toml; then
              echo "✘ packages/worker/wrangler.toml 仍含 REPLACE_WITH_* 占位符，无法部署。"
              echo "  请把 D1 的 database_id、KV 的 id/preview_id 换成真实值（见 docs/DEPLOY.md）。"
              grep -n 'REPLACE_WITH_' packages/worker/wrangler.toml
              exit 1
            fi
            echo "✔ 部署配置已就绪"
        - name: migrate
          image: node:22
          script: npx wrangler d1 migrations apply dwz --remote --config packages/worker/wrangler.toml
        - name: deploy-worker
          image: node:22
          script: npx wrangler deploy --config packages/worker/wrangler.toml
        - name: deploy-pages
          image: node:22
          script: |
            set -e
            npm run build:web

            # Pages 项目不会随 wrangler 部署自动创建：项目不存在时 pages deploy 直接报
            # "The Pages project \"dwz\" does not exist."，而这属于一次性初始化，
            # 放在流水线里做掉，免得每次发布都先手动建项目。
            # --json 让判断不依赖表格渲染宽度；grep 退出码即「存在与否」。
            if npx wrangler pages project list --json | grep -q '"name":"dwz"'; then
              echo "Pages 项目 dwz 已存在"
            else
              echo "Pages 项目 dwz 不存在，先创建"
              npx wrangler pages project create dwz --production-branch main
            fi

            # --branch 决定的是 Pages 的「部署分支」，不是 git 分支：
            # production-branch 命中的分支发布成生产环境，其余发布成预览环境。
            # 若非要用 $CNB_BRANCH 这类 git 分支名，请保证 CNB 事件里能取到它。
            npx wrangler pages deploy packages/web/dist --project-name dwz --branch main

  # .cnb/tag_deploy.yml 的「部署」按钮触发
  tag_deploy.production:
    - imports:
        - *cf-secrets
      stages: *deploy-stages

  # .cnb/web_trigger.yml 的分支页「部署到 Cloudflare」按钮触发
  web_trigger_deploy:
    - imports:
        - *cf-secrets
      stages: *deploy-stages
